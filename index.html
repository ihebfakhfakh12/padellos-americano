<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Padellos"><meta name="theme-color" content="#08102b"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>Padellos Americano</title>
<meta name="apple-mobile-web-app-title" content="Padellos">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column courtside app, sticky header, bottom tab bar; dark-first (evening tournaments) */
:root {
  color-scheme: dark;
  --bg: #08102b;
  --surface: #101a3f;
  --surface-2: #17235a;
  --line: #26336b;
  --fg: #f3f1ea;
  --muted: #98a2c8;
  --gold: #e2b45a;
  --gold-ink: #1d1406;
  --ball: #d6f02e;
  --ball-ink: #1b2400;
  --win: #4fd18b;
  --loss: #ff7a7a;
  --overlay: rgba(3, 6, 20, .66);
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Barlow", -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #eef0f7; --surface: #ffffff; --surface-2: #e4e8f4; --line: #d2d8ea;
    --fg: #0c1538; --muted: #586283; --gold: #96690f; --gold-ink: #ffffff;
    --ball: #d6f02e; --ball-ink: #1b2400; --win: #12804a; --loss: #c62f2f;
    --overlay: rgba(12, 21, 56, .45);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #eef0f7; --surface: #ffffff; --surface-2: #e4e8f4; --line: #d2d8ea;
  --fg: #0c1538; --muted: #586283; --gold: #96690f; --gold-ink: #ffffff;
  --ball: #d6f02e; --ball-ink: #1b2400; --win: #12804a; --loss: #c62f2f;
  --overlay: rgba(12, 21, 56, .45);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); }
body {
  color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; }

/* header */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; align-items: center; gap: 12px; padding-block: 12px 10px;
  border-bottom: 1px solid var(--line);
}
header.top img { width: 46px; height: 46px; border-radius: 50%; flex: none; }
.brand { min-width: 0; flex: 1; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: .02em; line-height: 1; text-transform: uppercase; }
.brand h1 span { color: var(--gold); }
.brand .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
.sync { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); flex: none; text-align: right; max-width: 120px; line-height: 1.2; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--win); }
.dot.busy { background: var(--gold); }
.dot.off { background: var(--loss); }

main { padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: .04em; text-transform: uppercase; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card h2 small { font-family: var(--body); font-weight: 500; font-size: 13px; color: var(--muted); letter-spacing: 0; text-transform: none; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }

.banner { border-radius: var(--radius); padding: 14px 16px; background: var(--ball); color: var(--ball-ink); display: grid; gap: 10px; }
.banner b { font-family: var(--display); font-size: 19px; text-transform: uppercase; letter-spacing: .03em; }
.banner p { margin: 0; font-size: 14px; }

input[type=text], textarea {
  width: 100%; min-width: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
  padding: 11px 12px; font-size: 16px; outline: none;
}
input[type=text]:focus, textarea:focus { border-color: var(--gold); }
textarea { min-height: 120px; resize: vertical; }

/* segmented & chips */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 10px 6px; font-weight: 600; font-size: 15px; color: var(--muted); }
.seg button[aria-pressed=true] { background: var(--gold); color: var(--gold-ink); }
.seg button:disabled { opacity: .5; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 8px 16px; font-family: var(--display); font-weight: 700; font-size: 20px; min-width: 56px; }
.chip[aria-pressed=true] { background: var(--ball); color: var(--ball-ink); border-color: var(--ball); }

.stepper { display: inline-flex; align-items: center; background: var(--surface-2); border-radius: 12px; border: 1px solid var(--line); }
.stepper button { width: 46px; height: 46px; border: 0; background: transparent; font-size: 24px; font-weight: 600; }
.stepper button:disabled { opacity: .35; }
.stepper output { min-width: 44px; text-align: center; font-family: var(--display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
.field { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.field .t { font-weight: 600; }
.field .t small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }

.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 12px 16px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); font-family: var(--display); font-size: 20px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 14px 18px; }
.btn.ball { background: var(--ball); color: var(--ball-ink); border-color: var(--ball); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--loss); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; }
.iconbtn { width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: transparent; display: grid; place-items: center; flex: none; color: var(--muted); }
.iconbtn:disabled { opacity: .3; }

/* participants */
.plist { display: grid; gap: 8px; }
.prow { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; }
.prow .num { font-family: var(--display); font-weight: 800; font-size: 20px; color: var(--gold); text-align: center; font-variant-numeric: tabular-nums; }
.prow .names { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; min-width: 0; }
.prow .names.one { grid-template-columns: 1fr; }
.lock { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.err { color: var(--loss); font-size: 14px; margin: 0; }

.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 10px; text-align: center; }
.stat b { display: block; font-family: var(--display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: 12px; color: var(--muted); }

/* rounds */
.rchips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.rchips::-webkit-scrollbar { display: none; }
.rchip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 12px; font-family: var(--display); font-weight: 700; font-size: 18px; position: relative; min-width: 54px; }
.rchip.done { border-color: var(--win); }
.rchip.done::after { content: ""; position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--win); }
.rchip[aria-current=true] { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
.rhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.rhead h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 34px; text-transform: uppercase; line-height: 1; white-space: nowrap; }
.rhead .hint { white-space: nowrap; text-align: right; }
.rhead .row { flex-wrap: nowrap; }
.rhead h2 span { color: var(--muted); font-size: 22px; }
.match { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 0; overflow: hidden; width: 100%; text-align: left; display: block; }
.match .court { display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; background: var(--surface-2); font-size: 13px; }
.match .court b { font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); }
.team { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; padding: 12px 14px; min-width: 0; }
.team + .team { border-top: 1px dashed var(--line); }
.team .tn { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; min-width: 0; }
.team .sc { font-family: var(--display); font-weight: 800; font-size: 34px; min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; line-height: 1; border-radius: 10px; padding: 4px 8px; background: var(--surface-2); color: var(--muted); }
.team.win .tn { color: var(--fg); }
.team.win .sc { background: var(--ball); color: var(--ball-ink); }
.team.lose .tn { color: var(--muted); font-weight: 500; }
.team.lose .sc { color: var(--fg); }
.tap { color: var(--muted); font-size: 13px; }
.rest { font-size: 14px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 12px 14px; }
.rest b { color: var(--fg); font-weight: 600; }
.nav2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* standings */
.progress { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ball); border-radius: 99px; }
.table { display: grid; gap: 6px; }
.trow { display: grid; grid-template-columns: 34px minmax(0, 1fr) repeat(3, 30px) 50px; gap: 6px; align-items: center; padding: 10px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.trow.head { background: transparent; border: 0; padding-block: 0; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.trow .rk { font-family: var(--display); font-weight: 800; font-size: 22px; text-align: center; font-variant-numeric: tabular-nums; }
.trow.p1 { border-color: var(--gold); }
.trow.p1 .rk, .trow.p2 .rk, .trow.p3 .rk { color: var(--gold); }
.trow .nm { font-weight: 600; overflow-wrap: anywhere; min-width: 0; font-size: 15px; line-height: 1.25; }
.trow .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.trow .c { text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.trow .d { text-align: right; font-family: var(--display); font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
.pos { color: var(--win); }
.neg { color: var(--loss); }

/* empty */
.empty { text-align: center; padding: 30px 16px; display: grid; gap: 12px; justify-items: center; }
.empty img { width: 84px; height: 84px; border-radius: 50%; }
.empty h3 { margin: 0; font-family: var(--display); font-size: 24px; text-transform: uppercase; }

/* tab bar */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
nav.tabs button { border: 0; background: transparent; display: grid; justify-items: center; gap: 2px; padding: 6px 4px; border-radius: 10px; color: var(--muted); font-size: 12px; font-weight: 600; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current=true] { color: var(--gold); background: var(--surface-2); }

/* sheet & modal */
.scrim { position: fixed; inset: 0; background: var(--overlay); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 560px; background: var(--surface); border-radius: 20px 20px 0 0; border: 1px solid var(--line); border-bottom: 0;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  max-height: 92%; overflow-y: auto; display: grid; gap: 14px;
  animation: up .22s cubic-bezier(.2, .8, .2, 1);
}
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet h3 { margin: 0; font-family: var(--display); font-size: 24px; text-transform: uppercase; }
.grab { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto; }
.qgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.qgrid button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; height: 44px; font-family: var(--display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.qgrid button[aria-pressed=true] { background: var(--ball); color: var(--ball-ink); border-color: var(--ball); }
.tpanel { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; text-align: left; background: var(--surface-2); border: 2px solid transparent; border-radius: 14px; padding: 12px 14px; }
.tpanel.on { border-color: var(--gold); background: var(--surface); }
.tpanel .tpn { font-weight: 700; font-size: 17px; overflow-wrap: anywhere; min-width: 0; line-height: 1.25; }
.tpanel .tpn small { display: block; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.tpanel.on .tpn small { color: var(--gold); }
.tpanel .tps { font-family: var(--display); font-weight: 800; font-size: 44px; min-width: 64px; text-align: center; line-height: 1; padding: 6px 8px; border-radius: 12px; background: var(--bg); font-variant-numeric: tabular-nums; }
.tpanel.w .tps { background: var(--ball); color: var(--ball-ink); }
.verdict { text-align: center; font-weight: 700; font-size: 16px; }
.verdict.muted { color: var(--muted); font-weight: 500; font-size: 14px; }
.free { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.free input { width: 22px; height: 22px; accent-color: var(--gold); }
.total { font-size: 14px; text-align: center; color: var(--muted); }
.total.warn { color: var(--gold); }
.acts { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(76px + env(safe-area-inset-top, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); text-align: center; }
</style>

<script>
(function () {
  'use strict';
  const KEY = 'padellos-americano-v1';
  const UIKEY = 'padellos-americano-ui';
  const POINTS = [11, 16, 21, 25, 27];
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10);
  const pk = (a, b) => a < b ? a + '|' + b : b + '|' + a;
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  const emptyPair = () => ({ id: uid(), p1: '', p2: '' });
  const emptyPlayer = () => ({ id: uid(), name: '' });
  function blank() {
    return { v: 1, updatedAt: 0, name: '', mode: 'pairs', courts: 2, points: 21, roundsWanted: null, pairs: [emptyPair(), emptyPair(), emptyPair(), emptyPair()], players: [], rounds: [] };
  }

  // ---------- storage ----------
  function loadLocal() {
    try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); if (s && s.v === 1) return s; } } catch (e) {}
    return null;
  }
  function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  let UI = { tab: 'setup', round: 0, sort: 'diff' };
  try { const u = JSON.parse(localStorage.getItem(UIKEY) || 'null'); if (u) UI = Object.assign(UI, u); } catch (e) {}
  function saveUI() { try { localStorage.setItem(UIKEY, JSON.stringify(UI)); } catch (e) {} }

  let S = loadLocal();
  if (!S || S.example) { S = blank(); UI.tab = 'setup'; UI.round = 0; }
  if (S.courts > 4) S.courts = 4;

  function commit(rerender) {
    S.updatedAt = Date.now();
    saveLocal();
    queueCloud();
    if (rerender !== false) render();
  }

  // ---------- cloud backup (db, private per viewer) ----------
  const cloud = { ref: null, writing: false, dirty: false, t: null };
  function setSync(kind) {
    const map = {
      local: ['', 'Sur cet appareil'],
      busy: ['busy', 'Synchronisation…'],
      ok: ['ok', 'Sauvegardé'],
      off: ['off', 'Hors ligne · gardé sur l’iPhone']
    };
    const [c, t] = map[kind] || map.local;
    const el = $('#sync'); el.hidden = false; el.innerHTML = '<span class="dot ' + c + '"></span><span>' + t + '</span>';
  }
  function queueCloud() {
    if (!cloud.ref) return;
    clearTimeout(cloud.t);
    cloud.t = setTimeout(flushCloud, 900);
  }
  async function flushCloud() {
    if (!cloud.ref) return;
    if (cloud.writing) { cloud.dirty = true; return; }
    cloud.writing = true; cloud.dirty = false; setSync('busy');
    try {
      await cloud.ref.set({ state: JSON.stringify(S), updatedAt: S.updatedAt });
      setSync('ok');
    } catch (e) {
      if (e && e.code !== 'unavailable') { cloud.ref = null; cloud.writing = false; setSync('local'); return; }
      if (e && e.code === 'unavailable') {
        cloud.writing = false;
        setTimeout(flushCloud, 1500 + Math.random() * 1500);
        setSync('off');
        return;
      }
      setSync('off');
    }
    cloud.writing = false;
    if (cloud.dirty) flushCloud();
  }
  async function initCloud() {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      cloud.ref = db.doc('data/users/' + id + '/americano');
      setSync('busy');
      const timer = setTimeout(() => setSync('off'), 10000);
      const snap = await cloud.ref.get();
      clearTimeout(timer);
      let remote = null, remoteAt = 0;
      if (snap.exists) {
        const d = snap.data() || {};
        remoteAt = d.updatedAt || 0;
        try { remote = JSON.parse(d.state); } catch (e) { remote = null; }
      }
      if (remote && remote.v === 1 && !remote.example && remoteAt > (S.updatedAt || 0)) {
        S = remote; saveLocal(); render();
        setSync('ok');
      } else if (S.updatedAt > remoteAt) {
        flushCloud();
      } else {

  }

  // keep the screen awake during the tournament
  let wake = null;
  async function keepAwake() {
    try { if (navigator.wakeLock && !wake && document.visibilityState === 'visible') { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {}
  }
  document.addEventListener('visibilitychange', keepAwake);
  document.addEventListener('pointerdown', keepAwake, { once: true });

  // ---------- participants ----------
  function participants(s) { s = s || S; return s.mode === 'pairs' ? s.pairs : s.players; }
  function pairLabel(p, i) {
    const a = (p.p1 || '').trim(), b = (p.p2 || '').trim();
    if (!a && !b) return 'Paire ' + (i + 1);
    return (a || '?') + ' / ' + (b || '?');
  }
  function nameOf(id) {
    if (S.mode === 'pairs') { const i = S.pairs.findIndex(p => p.id === id); return i < 0 ? '?' : pairLabel(S.pairs[i], i); }
    const i = S.players.findIndex(p => p.id === id); if (i < 0) return '?';
    return (S.players[i].name || '').trim() || 'Joueur ' + (i + 1);
  }
  function teamName(ids) { return ids.map(nameOf).join(' / '); }

  // ---------- scheduling ----------
  function circleRounds(ids) {
    const arr = ids.slice(); if (arr.length % 2) arr.push(null);
    const n = arr.length, out = [];
    for (let r = 0; r < n - 1; r++) {
      const ms = [];
      for (let i = 0; i < n / 2; i++) { const a = arr[i], b = arr[n - 1 - i]; if (a && b) ms.push([a, b]); }
      out.push(ms);
      arr.splice(1, 0, arr.pop());
    }
    return out;
  }
  function schedulePairs(ids, courts, R, oneCycle, exclude) {
    if (ids.length < 2 || R <= 0) return [];
    const maxPer = Math.max(1, Math.min(courts, Math.floor(ids.length / 2)));
    let queue = [], cycle = 0, seq = 0;
    const fill = () => { const order = cycle === 0 ? ids : shuffle(ids); circleRounds(order).forEach(r => r.forEach(m => { if (cycle === 0 && exclude && exclude.has(pk(m[0], m[1]))) return; queue.push({ m, i: seq++ }); })); cycle++; };
    const wait = {}; ids.forEach(id => wait[id] = 0);
    const rounds = [];
    while (rounds.length < R) {
      if (!queue.length) { if (oneCycle && cycle > 0) break; fill(); if (!queue.length) { if (oneCycle) break; fill(); } }
      const sorted = queue.slice().sort((x, y) => (wait[y.m[0]] + wait[y.m[1]]) - (wait[x.m[0]] + wait[x.m[1]]) || x.i - y.i);
      const used = new Set(), pick = [];
      for (const q of sorted) {
        if (pick.length >= maxPer) break;
        if (used.has(q.m[0]) || used.has(q.m[1])) continue;
        pick.push(q); used.add(q.m[0]); used.add(q.m[1]);
      }
      if (!pick.length) break;
      queue = queue.filter(q => !pick.includes(q));
      ids.forEach(id => { wait[id] = used.has(id) ? 0 : wait[id] + 1; });
      rounds.push({ matches: pick.map(q => [[q.m[0]], [q.m[1]]]), rest: ids.filter(id => !used.has(id)) });
    }
    return rounds;
  }
  function scheduleClassic(ids, courts, R, prior) {
    if (ids.length < 4 || R <= 0) return [];
    const N = ids.length, k = Math.max(1, Math.min(courts, Math.floor(N / 4)));
    const key = (a, b) => a < b ? a + '|' + b : b + '|' + a;
    const partner = {}, opp = {}, rests = {}, played = {};
    ids.forEach(id => { rests[id] = 0; played[id] = 0; });
    const P = (a, b) => partner[key(a, b)] || 0, O = (a, b) => opp[key(a, b)] || 0;
    (prior || []).forEach(r => {
      r.matches.forEach(m => {
        if (m.a.length === 2) partner[key(m.a[0], m.a[1])] = P(m.a[0], m.a[1]) + 1;
        if (m.b.length === 2) partner[key(m.b[0], m.b[1])] = P(m.b[0], m.b[1]) + 1;
        m.a.forEach(x => m.b.forEach(y => { opp[key(x, y)] = O(x, y) + 1; }));
        m.a.concat(m.b).forEach(x => { if (x in played) played[x]++; });
      });
      (r.rest || []).forEach(x => { if (x in rests) rests[x]++; });
    });
    const rounds = [];
    for (let r = 0; r < R; r++) {
      const nRest = N - 4 * k;
      const order = shuffle(ids).sort((a, b) => played[b] - played[a] || rests[a] - rests[b]);
      const resting = order.slice(0, nRest);
      const active = ids.filter(id => !resting.includes(id));
      let best = null, bestCost = Infinity;
      for (let it = 0; it < 900 && bestCost > 0; it++) {
        const s = shuffle(active);
        let cost = 0;
        for (let j = 0; j < k; j++) {
          const [a, b, c, d] = s.slice(4 * j, 4 * j + 4);
          cost += 10 * (P(a, b) + P(c, d)) + 2 * (O(a, c) + O(a, d) + O(b, c) + O(b, d));
        }
        if (cost < bestCost) { bestCost = cost; best = s; }
      }
      const matches = [];
      for (let j = 0; j < k; j++) {
        const [a, b, c, d] = best.slice(4 * j, 4 * j + 4);
        matches.push([[a, b], [c, d]]);
        partner[key(a, b)] = P(a, b) + 1; partner[key(c, d)] = P(c, d) + 1;
        [[a, c], [a, d], [b, c], [b, d]].forEach(([x, y]) => opp[key(x, y)] = O(x, y) + 1);
        [a, b, c, d].forEach(x => played[x]++);
      }
      resting.forEach(x => rests[x]++);
      rounds.push({ matches, rest: resting });
    }
    return rounds;
  }
  function permutations(n) {
    const res = [], a = [...Array(n).keys()];
    const rec = k => { if (k === n) { res.push(a.slice()); return; } for (let i = k; i < n; i++) { [a[k], a[i]] = [a[i], a[k]]; rec(k + 1); [a[k], a[i]] = [a[i], a[k]]; } };
    rec(0); return res;
  }
  // spread every pair / player over all the courts instead of always the same one
  function balanceCourts(raw, prior) {
    const cnt = {};
    const get = (id, c) => (cnt[id] && cnt[id][c]) || 0;
    const add = (id, c) => { cnt[id] = cnt[id] || {}; cnt[id][c] = get(id, c) + 1; };
    (prior || []).forEach(r => r.matches.forEach(m => m.a.concat(m.b).forEach(id => add(id, m.court))));
    return raw.map(r => {
      const n = r.matches.length;
      const perms = n <= 5 ? permutations(n) : [[...Array(n).keys()]];
      let best = perms[0], bc = Infinity;
      for (const pm of perms) {
        let c = 0;
        r.matches.forEach((m, i) => m[0].concat(m[1]).forEach(id => { const v = get(id, pm[i] + 1); c += v * v + v; }));
        if (c < bc) { bc = c; best = pm; }
      }
      const ordered = [];
      r.matches.forEach((m, i) => { ordered[best[i]] = m; });
      ordered.forEach((m, ci) => m[0].concat(m[1]).forEach(id => add(id, ci + 1)));
      return { matches: ordered, rest: r.rest };
    });
  }
  function defaultRounds(s) {
    const ids = participants(s).map(p => p.id);
    if (s.mode === 'pairs') { if (ids.length < 2) return 1; return schedulePairs(ids, s.courts, 999, true).length; }
    const N = ids.length; if (N < 4) return 1;
    return Math.min(12, N % 4 === 0 ? N - 1 : N);
  }
  function roundsCount(s) { return s.roundsWanted || defaultRounds(s); }
  function buildRounds(s) {
    const ids = participants(s).map(p => p.id);
    const R = roundsCount(s);
    const raw = s.mode === 'pairs' ? schedulePairs(ids, s.courts, R, false) : scheduleClassic(ids, s.courts, R);
    return toRounds(balanceCourts(raw, []), 1);
  }
  function toRounds(raw, startN) {
    return raw.map((r, i) => ({ n: startN + i, courts: S ? S.courts : 2, rest: r.rest, matches: r.matches.map((m, j) => ({ id: uid(), court: j + 1, a: m[0], b: m[1], sa: null, sb: null })) }));
  }
  function lastScored() { let k = -1; S.rounds.forEach((r, i) => { if (r.matches.some(m => m.sa != null)) k = i; }); return k; }
  function hasPlayed(id) { return S.rounds.some(r => r.matches.some(m => m.sa != null && m.a.concat(m.b).includes(id))); }
  // keep every round up to the last one with a score; recompute the rounds after it
  function replan() {
    const ids = participants().map(p => p.id), set = new Set(ids);
    const k = lastScored();
    const kept = S.rounds.slice(0, k + 1).map(r => ({ n: r.n, courts: r.courts, rest: r.rest.filter(id => set.has(id)), matches: r.matches.filter(m => m.sa != null || m.a.concat(m.b).every(id => set.has(id))) }));
    let raw = [];
    if (ids.length >= minNeeded()) {
      if (S.mode === 'pairs') {
        const played = new Set(kept.flatMap(r => r.matches.map(m => pk(m.a[0], m.b[0]))));
        const left = S.roundsWanted ? Math.max(0, S.roundsWanted - kept.length) : 999;
        raw = schedulePairs(ids, S.courts, left, !S.roundsWanted, played);
      } else {
        const target = S.roundsWanted || defaultRounds(S);
        raw = scheduleClassic(ids, S.courts, Math.max(0, target - kept.length), kept);
      }
    }
    S.rounds = kept.concat(toRounds(balanceCourts(raw, kept), kept.length + 1));
    S.rounds.forEach((r, i) => { r.n = i + 1; });
    if (UI.round >= S.rounds.length) UI.round = Math.max(0, S.rounds.length - 1);
    saveUI();
  }
  function afterChange() {
    if (S.rounds.length) { replan(); commit(); toast('Programme mis à jour · ' + S.rounds.length + ' rounds'); }

  const named = v => (v || '').trim() !== '';
  // same people, other format: pairs -> players (split), players -> pairs (in order)
  function switchMode(m) {
    if (m === 'classic') {
      const names = [];
      S.pairs.forEach(p => { if (named(p.p1)) names.push(p.p1.trim()); if (named(p.p2)) names.push(p.p2.trim()); });
      S.players = names.length ? names.map(n => ({ id: uid(), name: n })) : [emptyPlayer(), emptyPlayer(), emptyPlayer(), emptyPlayer()];
    } else {
      const names = S.players.filter(p => named(p.name)).map(p => p.name.trim());
      const pairs = [];
      for (let i = 0; i < names.length; i += 2) pairs.push({ id: uid(), p1: names[i], p2: names[i + 1] || '' });
      S.pairs = pairs.length ? pairs : [emptyPair(), emptyPair(), emptyPair(), emptyPair()];
    }
    const had = S.rounds.length > 0;
    S.mode = m; S.roundsWanted = null; S.rounds = []; UI.round = 0; saveUI();
    if (had && participants().length >= minNeeded()) S.rounds = buildRounds(S);

  }
  function dropEmpty() {
    if (S.mode === 'pairs') S.pairs = S.pairs.filter(p => named(p.p1) || named(p.p2));
    else S.players = S.players.filter(p => named(p.name));
  }
  function minNeeded() { return S.mode === 'pairs' ? 2 : 4; }
  function hasScores() { return S.rounds.some(r => r.matches.some(m => m.sa != null)); }

  // ---------- standings ----------
  function standings() {
    const rows = {};
    participants().forEach((p, i) => rows[p.id] = { id: p.id, name: nameOf(p.id), J: 0, V: 0, N: 0, D: 0, PM: 0, PE: 0 });
    let done = 0, total = 0;
    for (const r of S.rounds) for (const m of r.matches) {
      total++;
      if (m.sa == null || m.sb == null) continue;
      done++;
      const credit = (ids, f, a) => ids.forEach(id => { const x = rows[id]; if (!x) return; x.J++; x.PM += f; x.PE += a; if (f > a) x.V++; else if (f < a) x.D++; else x.N++; });
      credit(m.a, m.sa, m.sb); credit(m.b, m.sb, m.sa);
    }
    const list = Object.values(rows).map(x => (x.diff = x.PM - x.PE, x));
    const keys = {
      diff: (a, b) => b.diff - a.diff || b.V - a.V || b.PM - a.PM,
      wins: (a, b) => b.V - a.V || b.N - a.N || b.diff - a.diff || b.PM - a.PM,
      points: (a, b) => b.PM - a.PM || b.diff - a.diff || b.V - a.V
    };
    const cmp = keys[UI.sort] || keys.diff;
    list.sort((a, b) => cmp(a, b) || a.name.localeCompare(b.name));
    list.forEach((x, i) => { x.rank = i > 0 && cmp(list[i - 1], x) === 0 ? list[i - 1].rank : i + 1; });
    return { list, done, total };
  }

    r.matches.forEach((m, j) => {
      const has = m.sa != null && m.sb != null;
      const ca = has ? (m.sa > m.sb ? 'win' : m.sa < m.sb ? 'lose' : '') : '';
      const cb = has ? (m.sb > m.sa ? 'win' : m.sb < m.sa ? 'lose' : '') : '';
      h += '<button type="button" class="match" data-match="' + j + '"><div class="court"><b>Terrain ' + m.court + '</b><span class="tap">' + (has ? (m.sa === m.sb ? 'Match nul · modifier' : 'Modifier') : 'Saisir le score') + '</span></div>' +
        '<div class="team ' + ca + '"><span class="tn">' + esc(teamName(m.a)) + '</span><span class="sc">' + (has ? m.sa : '–') + '</span></div>' +
        '<div class="team ' + cb + '"><span class="tn">' + esc(teamName(m.b)) + '</span><span class="sc">' + (has ? m.sb : '–') + '</span></div></button>';
    });
    const nP = participants().length, isP = S.mode === 'pairs';
    const maxPer = isP ? Math.floor(nP / 2) : Math.floor(nP / 4);
    let note = '';
    if (r.matches.length < S.courts) {
      if (r.courts && r.courts < S.courts && UI.round <= lastScored()) note = 'Ce round a commencé avec ' + r.courts + ' terrain' + (r.courts > 1 ? 's' : '') + ' : ses scores sont gardés. Les rounds suivants utilisent ' + S.courts + ' terrains.';
      else if (maxPer < S.courts) note = 'Avec ' + nP + (isP ? ' paires' : ' joueurs') + ', ' + maxPer + ' match' + (maxPer > 1 ? 's' : '') + ' maximum en même temps : ' + maxPer + ' terrain' + (maxPer > 1 ? 's' : '') + ' sur ' + S.courts + ' utilisé' + (maxPer > 1 ? 's' : '') + '.';
      else note = 'Fin du tableau : il reste ' + r.matches.length + ' match' + (r.matches.length > 1 ? 's' : '') + ' à jouer dans ce round.';
    }
    if (note) h += '<div class="lock">' + note + '</div>';
    if (r.rest && r.rest.length) h += '<div class="rest">Au repos : <b>' + r.rest.map(id => esc(nameOf(id))).join(' · ') + '</b></div>';
    h += '<div class="nav2"><button type="button" class="btn" data-round="' + (UI.round - 1) + '" ' + (UI.round === 0 ? 'disabled' : '') + '>← Round précédent</button><button type="button" class="btn ball" data-round="' + (UI.round + 1) + '" ' + (UI.round >= S.rounds.length - 1 ? 'disabled' : '') + '>Round suivant →</button></div>';
    return h;
  }

  function viewStandings() {
    if (participants().length === 0) {
      return '<div class="card empty"><img src="' + $('header.top img').src + '" alt=""><h3>Classement vide</h3><p class="hint">Le classement apparaît dès que les participants sont ajoutés.</p><button type="button" class="btn primary" data-tab="setup">Ajouter les participants</button></div>';

      '<div class="seg" role="group" aria-label="Trier par">' +
      [['diff', 'Différence'], ['wins', 'Victoires'], ['points', 'Points marqués']].map(([k, t]) => '<button type="button" data-sort="' + k + '" aria-pressed="' + (UI.sort === k) + '">' + t + '</button>').join('') + '</div></section>';
    h += '<div class="table" role="table"><div class="trow head" role="row"><span>#</span><span>' + (S.mode === 'pairs' ? 'Paire' : 'Joueur') + '</span><span class="c">V</span><span class="c">N</span><span class="c">D</span><span style="text-align:right">+/−</span></div>';
    list.forEach(x => {
      const cls = x.rank <= 3 && x.J > 0 ? ' p' + x.rank : '';
      h += '<div class="trow' + cls + '" role="row"><span class="rk">' + x.rank + '</span><span class="nm">' + esc(x.name) + '<small>' + x.J + ' match' + (x.J > 1 ? 's' : '') + ' · ' + x.PM + '–' + x.PE + '</small></span><span class="c">' + x.V + '</span><span class="c">' + x.N + '</span><span class="c">' + x.D + '</span><span class="d ' + (x.diff > 0 ? 'pos' : x.diff < 0 ? 'neg' : '') + '">' + (x.diff > 0 ? '+' : '') + x.diff + '</span></div>';
    });
    h += '</div>';
    h += '<p class="hint">V / N / D : victoires, nuls, défaites. Sous le nom : matchs joués · points marqués–encaissés. +/− = marqués moins encaissés.</p>';
    h += '<button type="button" class="btn block" data-act="copystand">Copier le classement (WhatsApp, Instagram…)</button>';
    return h;
  }

  // ---------- overlays ----------
  function closeLayer() { $('#layer').innerHTML = ''; }
  function confirmBox(title, text, okLabel, onOk) {
    $('#layer').innerHTML = '<div class="scrim" data-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><div class="grab"></div><h3>' + esc(title) + '</h3><p class="hint" style="font-size:15px">' + esc(text) + '</p><div class="acts"><button type="button" class="btn" data-close="1">Annuler</button><button type="button" class="btn primary" id="c-ok" style="font-size:18px">' + esc(okLabel) + '</button></div></div></div>';
    $('#c-ok').addEventListener('click', () => { closeLayer(); onOk(); });
  }
  let edit = null;
  function openScore(j) {
    const m = S.rounds[UI.round].matches[j];
    edit = { r: UI.round, j, sa: m.sa, sb: m.sb, side: 'a', free: m.sa != null && m.sa + m.sb !== S.points };
    drawScore();
  }
  function drawScore() {
    const r = S.rounds[edit.r], m = r.matches[edit.j], N = S.points;
    const names = { a: teamName(m.a), b: teamName(m.b) };
    const val = { a: edit.sa, b: edit.sb };
    const both = edit.sa != null && edit.sb != null;
    const panel = k => {
      const o = k === 'a' ? 'b' : 'a';
      const win = both && val[k] > val[o];
      return '<button type="button" class="tpanel' + (edit.side === k ? ' on' : '') + (win ? ' w' : '') + '" data-side="' + k + '" aria-pressed="' + (edit.side === k) + '">' +
        '<span class="tpn"><small>' + (edit.side === k ? 'Score en cours de saisie' : 'Toucher pour saisir') + '</small>' + esc(names[k]) + '</span>' +
        '<span class="tps">' + (val[k] == null ? '–' : val[k]) + '</span></button>';
    };
    let grid = '';
    for (let i = 0; i <= N; i++) grid += '<button type="button" data-q="' + i + '" aria-pressed="' + (val[edit.side] === i) + '">' + i + '</button>';
    let verdict;
    if (!both) verdict = '<div class="verdict muted">Choisis une équipe puis touche ses points' + (edit.free ? '' : ' : l’autre équipe est complétée (total ' + N + ')') + '.</div>';
    else if (edit.sa === edit.sb) verdict = '<div class="verdict">Match nul · ' + edit.sa + '–' + edit.sb + '</div>';
    else verdict = '<div class="verdict">Vainqueur : ' + esc(edit.sa > edit.sb ? names.a : names.b) + ' · ' + Math.max(edit.sa, edit.sb) + '–' + Math.min(edit.sa, edit.sb) + '</div>';
    const tot = (edit.sa || 0) + (edit.sb || 0);
    $('#layer').innerHTML = '<div class="scrim" data-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="Score du match"><div class="grab"></div>' +
      '<div class="row between"><div><div class="label">Round ' + r.n + ' · Terrain ' + m.court + ' · ' + N + ' points</div><h3 style="margin-top:4px">Score du match</h3></div>' +
      '<button type="button" class="btn ghost" data-act="swap" ' + (both ? '' : 'disabled') + ' aria-label="Inverser les deux scores">⇅ Inverser</button></div>' +
      panel('a') + panel('b') +
      '<div><div class="label" style="margin-bottom:8px">Points de ' + esc(names[edit.side]) + '</div><div class="qgrid">' + grid + '</div></div>' +
      '<label class="free"><input type="checkbox" id="f-free" ' + (edit.free ? 'checked' : '') + '>Match arrêté au temps : saisir les deux scores séparément</label>' +
      (edit.free && both ? '<div class="total' + (tot !== N ? ' warn' : '') + '">Total ' + tot + ' points' + (tot !== N ? ' (au lieu de ' + N + ')' : '') + '</div>' : '') +
      verdict +
      '<div class="acts"><button type="button" class="btn ' + (m.sa != null ? 'danger' : '') + '" data-act="' + (m.sa != null ? 'clearscore' : 'cancel') + '">' + (m.sa != null ? 'Effacer le score' : 'Annuler') + '</button><button type="button" class="btn primary" data-act="savescore" ' + (both ? '' : 'disabled') + '>Enregistrer</button></div>' +
      '</div></div>';
  }

  function toast(t) {
    const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d);
    setTimeout(() => d.remove(), 1800);
  }
  function copyText(text) {
    const fallback = () => {
      $('#layer').innerHTML = '<div class="scrim" data-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="Copier"><div class="grab"></div><h3>Copier le texte</h3><p class="hint">Sélectionne le texte puis copie-le.</p><textarea id="f-copy" readonly style="min-height:220px">' + esc(text) + '</textarea><button type="button" class="btn" data-close="1">Fermer</button></div></div>';

  }

  // ---------- events ----------
  document.addEventListener('change', e => {
    if (e.target.id === 'f-free' && edit) {
      edit.free = e.target.checked;
      if (!edit.free) { const k = edit.side === 'a' ? 'sa' : 'sb', o = edit.side === 'a' ? 'sb' : 'sa'; if (edit[k] != null) edit[o] = S.points - edit[k]; }
      drawScore();
    }
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'f-name') { S.name = t.value; $('#tname').textContent = S.name || 'Nouveau tournoi'; commit(false); return; }
    if (t.dataset && t.dataset.pid) {
      const list = participants();
      const p = list.find(x => x.id === t.dataset.pid);
      if (p) { p[t.dataset.f] = t.value; commit(false); }
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.dataset && e.target.dataset.pid) {
      e.preventDefault();
      const inputs = Array.from(document.querySelectorAll('input[data-pid]'));
      const i = inputs.indexOf(e.target);
      if (i >= 0 && i < inputs.length - 1) inputs[i + 1].focus();
      else if (!S.rounds.length) addParticipant(true);
    }
  });
  function addParticipant(focus) {
    if (S.mode === 'pairs') S.pairs.push({ id: uid(), p1: '', p2: '' });
    else S.players.push({ id: uid(), name: '' });
    S.roundsWanted = null;
    afterChange();
    if (focus) { const inputs = document.querySelectorAll('input[data-pid]'); const last = S.mode === 'pairs' ? inputs[inputs.length - 2] : inputs[inputs.length - 1]; if (last) last.focus(); }
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('button, [data-close]');
    if (!el) return;
    if (el.dataset.close && (e.target === el || el.tagName === 'BUTTON')) { closeLayer(); edit = null; return; }
    if (el.tagName !== 'BUTTON' || el.disabled) return;
    const d = el.dataset;

    if (d.tab) { UI.tab = d.tab; saveUI(); render(); window.scrollTo(0, 0); return; }
    if (d.mode) {
      if (d.mode === S.mode) return;
      const label = d.mode === 'pairs' ? 'Paires fixes' : 'Americano classique';
      if (hasScores()) confirmBox('Passer en ' + label, 'Les scores déjà saisis seront effacés et un nouveau programme sera créé avec les mêmes joueurs.', 'Changer de format', () => switchMode(d.mode));
      else switchMode(d.mode);
      return;
    }
    if (d.points) { S.points = +d.points; commit(); return; }
    if (d.sort) { UI.sort = d.sort; saveUI(); render(); return; }
    if (d.step) {
      const dv = +d.d;
      if (d.step === 'courts') { S.courts = Math.max(1, Math.min(4, S.courts + dv)); S.roundsWanted = null; }
      if (d.step === 'rounds') {
        const cur = S.rounds.length ? S.rounds.length : roundsCount(S);
        const min = S.rounds.length ? Math.max(1, lastScored() + 1) : 1;
        S.roundsWanted = Math.max(min, Math.min(40, cur + dv));
      }
      afterChange(); return;
    }
    if (d.del) {
      const id = d.del;
      const doDel = () => {
        const list = participants(); const i = list.findIndex(x => x.id === id);
        if (i >= 0) list.splice(i, 1);
        S.roundsWanted = null; afterChange();
      };
      if (hasPlayed(id)) confirmBox('Retirer ' + nameOf(id), 'Ses matchs déjà joués restent comptés pour ses adversaires. Les prochains rounds seront recalculés.', 'Retirer', doDel);
      else doDel();
      return;
    }
    if (d.round != null && el.classList.contains('rchip') || (d.round != null && el.closest('.nav2'))) {
      const i = +d.round; if (i >= 0 && i < S.rounds.length) { UI.round = i; saveUI(); render(); window.scrollTo(0, 0); }
      const chip = document.querySelector('.rchip[aria-current=true]'); if (chip) chip.scrollIntoView({ inline: 'center', block: 'nearest' });
      return;
    }
    if (d.match != null) { openScore(+d.match); return; }
    if (d.side && edit) { edit.side = d.side; drawScore(); return; }
    if (d.q != null && edit) {
      const v = +d.q, k = edit.side === 'a' ? 'sa' : 'sb', o = edit.side === 'a' ? 'sb' : 'sa';
      edit[k] = v;
      if (!edit.free) edit[o] = S.points - v;
      else if (edit[o] == null) edit.side = edit.side === 'a' ? 'b' : 'a';
      drawScore(); return;
    }

    switch (d.act) {
      case 'add': addParticipant(true); break;
      case 'paste': { const b = $('#pastebox'); b.hidden = !b.hidden; if (!b.hidden) $('#f-paste').focus(); break; }
      case 'pasteok': {
        const lines = $('#f-paste').value.split(/\n/).map(x => x.trim()).filter(Boolean);
        if (!lines.length) return;
        // drop empty rows before adding
        if (S.mode === 'pairs') {
          if (!S.rounds.length) S.pairs = S.pairs.filter(p => (p.p1 || '').trim() || (p.p2 || '').trim());
          lines.forEach(l => {
            const parts = l.replace(/^\d+[\).\-\s]+/, '').split(/\s*(?:\/|&|\+|,|;|\s-\s|–|\set\s)\s*/i).filter(Boolean);
            S.pairs.push({ id: uid(), p1: parts[0] || '', p2: parts.slice(1).join(' ') || '' });
          });
        } else {
          if (!S.rounds.length) S.players = S.players.filter(p => (p.name || '').trim());
          lines.forEach(l => l.split(/\s*[,;]\s*/).filter(Boolean).forEach(n => S.players.push({ id: uid(), name: n.replace(/^\d+[\).\-\s]+/, '') })));
        }
        S.roundsWanted = null; afterChange(); if (!S.rounds.length) toast(lines.length + ' ligne' + (lines.length > 1 ? 's' : '') + ' ajoutée' + (lines.length > 1 ? 's' : ''));
        break;
      }
      case 'generate': {
        dropEmpty();
        if (participants().length < minNeeded()) { commit(); toast('Remplis au moins ' + minNeeded() + (S.mode === 'pairs' ? ' paires' : ' joueurs')); return; }
        S.rounds = buildRounds(S); UI.round = 0; UI.tab = 'rounds'; saveUI(); commit(); window.scrollTo(0, 0);
        toast(S.rounds.length + ' rounds générés');
        break;
      }
      case 'regen':
        confirmBox('Recommencer le programme', hasScores() ? 'Les rounds et tous les scores saisis seront effacés. Les participants restent.' : 'Les rounds seront effacés. Les participants restent.', 'Effacer les rounds', () => {
          S.rounds = []; UI.round = 0; saveUI(); commit();
        });
        break;
      case 'reset':
        confirmBox('Nouveau tournoi', 'Le nom, les participants, les rounds et les scores seront effacés. Le format, les terrains et les points restent réglés.', 'Tout effacer', () => {
          const keep = { mode: S.mode, courts: S.courts, points: S.points };
          S = Object.assign(blank(), keep);
          if (S.mode === 'classic') { S.players = [emptyPlayer(), emptyPlayer(), emptyPlayer(), emptyPlayer()]; S.pairs = []; }
          UI.round = 0; saveUI(); commit(); window.scrollTo(0, 0); toast('Nouveau tournoi prêt');
        });
        break;
      case 'cancel': closeLayer(); edit = null; break;
      case 'swap': { const t = edit.sa; edit.sa = edit.sb; edit.sb = t; drawScore(); break; }
      case 'savescore': {
        const r = S.rounds[edit.r], m = r.matches[edit.j];
        if (edit.sa == null || edit.sb == null) return;
        m.sa = edit.sa; m.sb = edit.sb; closeLayer(); edit = null; commit();
        if (r.matches.every(x => x.sa != null) && r.n < S.rounds.length) toast('Round ' + r.n + ' terminé');
        else toast('Score enregistré');
        break;
      }
      case 'clearscore': {
        const m = S.rounds[edit.r].matches[edit.j];
        m.sa = null; m.sb = null; closeLayer(); edit = null; commit(); toast('Score effacé'); break;
      }
      case 'sharelink': copyText(exportLink()); break;
      case 'importlink': {
        const c = codeFrom($('#f-import').value);
        if (!c) { toast('Colle le lien complet du tournoi (il contient #t=)'); return; }
        handleImport(c, true); break;
      }
      case 'copyround': {
        const r = S.rounds[UI.round];
        let t = '🎾 ' + (S.name || 'Americano') + ' — Round ' + r.n + '\n';
        r.matches.forEach(m => { t += 'Terrain ' + m.court + ' : ' + teamName(m.a) + ' vs ' + teamName(m.b) + (m.sa != null ? ' (' + m.sa + '–' + m.sb + ')' : '') + '\n'; });
        if (r.rest.length) t += 'Repos : ' + r.rest.map(nameOf).join(', ') + '\n';
        copyText(t.trim()); break;
      }
      case 'copystand': {
        const { list, done, total } = standings();
        const medal = ['🥇', '🥈', '🥉'];
        let t = '🏆 Classement — ' + (S.name || 'Americano') + ' (' + done + '/' + total + ' matchs)\n';
        list.forEach(x => { t += (x.rank <= 3 && x.J ? medal[x.rank - 1] : x.rank + '.') + ' ' + x.name + ' — ' + x.V + 'V ' + x.N + 'N ' + x.D + 'D · ' + (x.diff > 0 ? '+' : '') + x.diff + ' (' + x.PM + '/' + x.PE + ')\n'; });
        t += '\nPadellos Club 🎾';
        copyText(t.trim()); break;
      }
    }
  });

  // ---------- send a tournament to another phone by link (#t=...) ----------
  function b64e(str) { return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function b64d(str) { return decodeURIComponent(escape(atob(str.replace(/-/g, '+').replace(/_/g, '/')))); }
  const canLink = !window.claude && /^https?:$/.test(location.protocol);
  function isEmpty() { return !S.rounds.length && !participants().some(p => named(p.p1) || named(p.p2) || named(p.name)); }
  function stateCode() {
    const list = participants(), idx = {}; list.forEach((p, i) => { idx[p.id] = i; });
    const d = { n: S.name, m: S.mode, c: S.courts, p: S.points,
      P: S.mode === 'pairs' ? list.map(p => [p.p1, p.p2]) : list.map(p => p.name),
      R: S.rounds.map(r => r.matches.map(m => [m.a.map(x => idx[x]), m.b.map(x => idx[x]), m.sa, m.sb])) };
    return b64e(JSON.stringify(d));
  }
  function exportLink() { return location.origin + location.pathname + '#t=' + stateCode(); }
  // addresses written by the previous version of the app on this phone: never treat them as a received link
  function fp(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
  function ownList() { try { return JSON.parse(localStorage.getItem('padellos-americano-own') || '[]'); } catch (e) { return []; } }
  function clearHash() { try { if (location.hash) history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  function decodeCode(code) {
    try {
      const d = JSON.parse(b64d(code));
      if (!d || !Array.isArray(d.P)) return null;
      const t = blank(); t.name = d.n || ''; t.mode = d.m === 'classic' ? 'classic' : 'pairs';
      t.courts = Math.max(1, Math.min(4, +d.c || 2)); t.points = POINTS.includes(+d.p) ? +d.p : 21;
      let ids;
      if (t.mode === 'pairs') { t.pairs = d.P.map(x => ({ id: uid(), p1: x[0] || '', p2: x[1] || '' })); ids = t.pairs.map(p => p.id); }
      else { t.players = d.P.map(n => ({ id: uid(), name: n || '' })); t.pairs = []; ids = t.players.map(p => p.id); }
      t.rounds = (d.R || []).map((ms, i) => {
        const used = new Set();
        const matches = ms.map((m, j) => {
          const a = m[0].map(k => ids[k]), b = m[1].map(k => ids[k]);
          if (a.concat(b).some(x => !x)) throw new Error('bad index');
          a.concat(b).forEach(x => used.add(x));
          return { id: uid(), court: j + 1, a, b, sa: m[2] == null ? null : +m[2], sb: m[3] == null ? null : +m[3] };
        });
        return { n: i + 1, courts: t.courts, rest: ids.filter(x => !used.has(x)), matches };
      });
      return t;
    } catch (e) { return null; }
  }
  function codeFrom(text) {
    const i = (text || '').indexOf('#t=');
    return i < 0 ? null : text.slice(i + 3).replace(/\s+/g, '');
  }
  function handleImport(code, fromPaste) {
    clearHash();
    if (!code) return;
    if (code === stateCode()) { if (fromPaste) toast('Ce tournoi est déjà ouvert'); return; }
    if (!fromPaste && ownList().includes(fp(code))) return;
    const t = decodeCode(code);
    if (!t) { toast('Lien incomplet : renvoie le lien en entier'); return; }
    const applyImport = () => { S = t; UI.tab = t.rounds.length ? 'rounds' : 'setup'; UI.round = 0; saveUI(); commit(); window.scrollTo(0, 0); toast('Tournoi ouvert : ' + (t.name || 'tournoi')); };
    if (!isEmpty()) confirmBox('Charger ' + (t.name || 'ce tournoi'), 'Le tournoi en cours sur ce téléphone sera remplacé par celui du lien.', 'Charger', applyImport);
    else applyImport();
  }
  window.addEventListener('hashchange', () => { if (canLink && codeFrom(location.hash)) handleImport(codeFrom(location.hash)); });

  render();
  if (new URLSearchParams(location.search).has('t')) { try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {} }
